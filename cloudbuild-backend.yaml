steps:
  # 1. Simple Syntax and Indentation Check
  - name: 'python:3.11-slim'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "Checking syntax and indentation of python files..."
        python -m compileall -q .
        echo "✅ Syntax check passed!"

  # 2. Build Backend Image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'asia-southeast1-docker.pkg.dev/$PROJECT_ID/harimau/backend:latest', '-f', 'backend/Dockerfile', 'backend/']

  # 3. Push Backend Image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'asia-southeast1-docker.pkg.dev/$PROJECT_ID/harimau/backend:latest']

  # 4. Deploy Backend to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'harimau-backend'
      - '--image'
      - 'asia-southeast1-docker.pkg.dev/$PROJECT_ID/harimau/backend:latest'
      - '--region'
      - 'asia-southeast1'
      - '--add-cloudsql-instances'
      - '$PROJECT_ID:asia-southeast1:harimau-db'
      - '--set-secrets'
      - 'VT_APIKEY=harimau-gti-api-key:latest,GTI_API_KEY=harimau-gti-api-key:latest,WEBRISK_API_KEY=harimau-webrisk-api-key:latest,SHODAN_API_KEY=harimau-shodan-api-key:latest,HARIMAU_API_KEY=harimau-api-key:latest,DATABASE_URL=harimau-db-url:latest'
      - '--no-cpu-throttling'
      - '--timeout=600'
      - '--quiet'

images:
  - 'asia-southeast1-docker.pkg.dev/$PROJECT_ID/harimau/backend:latest'
